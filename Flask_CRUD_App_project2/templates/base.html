<!-- templates/base.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Employee Manager{% endblock %}</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <!-- Navigation -->
    <nav class="navbar">
      <div class="container">
        <a href="{{ url_for('index') }}" class="logo">👥 Employee Manager</a>
        <div class="nav-links">
          <a href="{{ url_for('index') }}">Home</a>
          <a href="{{ url_for('create') }}" class="btn btn-primary"
            >+ Add Employee</a
          >
        </div>
      </div>
    </nav>

    <!-- Flash Messages -->
    <div class="container">
      {% with messages = get_flashed_messages(with_categories=true) %} {% if
      messages %} {% for category, message in messages %}
      <div class="alert alert-{{ category }}">
        {{ message }}
        <span class="close-btn" onclick="this.parentElement.remove()">×</span>
      </div>
      {% endfor %} {% endif %} {% endwith %} {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    <footer class="footer">
      <div class="container">
        <p>Flask CRUD Application &copy; 2024</p>
      </div>
    </footer>
  </body>
</html>
